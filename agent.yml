name: paper-agent
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-agent
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: एजेंट चलाओ
        env:
          DATA_SOURCE: coinbase
        run: python btc_agent.py once
      - name: स्टेट सेव करो
        run: |
          git config user.name "paper-agent"
          git config user.email "paper-agent@users.noreply.github.com"
          git add state.json knowledge.json days.csv trades.csv
          git diff --cached --quiet || (git commit -m "update" && git pull --rebase -q && git push)
